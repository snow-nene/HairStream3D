[workspace]
name = "HairStep_ours"
version = "0.1.0"
authors = ["clifford <1453631832@qq.com>"]
channels = ["pytorch3d", "pytorch", "nvidia", "conda-forge"]
platforms = [
    "linux-64",
    { platform = "linux-64", cuda = "12.0" }
]

[pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[dependencies]
python = "3.10.*"
# 从 conda/pytorch 频道安装带 cuda 的 pytorch 和 torchvision
pytorch = { version = "2.1.2.*", channel = "pytorch" }
torchvision = { version = "0.16.2.*", channel = "pytorch" }
pytorch-cuda = "11.8.*"  # 显式引入 CUDA 11.8 依赖项
tqdm = ">=4.69.0,<5"
scikit-image = "==0.19.3"
modelscope = ">=1.37.1,<2"
timm = ">=1.0.28,<2"
numpy = ">=1.20,<1.24"
rtree = ">=1.4.1,<2"
chumpy = ">=0.70,<0.71"
pip = ">=26.1.2,<27"
pytorch3d = ">=0.7.8,<0.8"

[pypi-dependencies]
# 移除 torchvision（移到了上面的 [dependencies] 中）
onnx = "==1.16.0"      
segment-anything = ">=1.0"
opencv-python = ">=4.8.0"
imageio = "*"
matplotlib = ">=3.5.0,<3.11.0"
imageio-ffmpeg = ">=0.6.0"
argparse = ">=1.4.0"
cython = ">=3.2.8"
scipy = "*"
gradio = "==2.9.4"
trimesh = "==3.9.36"
open3d = ">=0.18.0, <0.19"
taichi = ">=1.7.4, <2"
pytest = ">=9.1.1, <10"

[tasks]
# 默认回归测试（硬编码常用测试图 0a1ba3dbefc8934ab60577c5c91f66a0，无需输入任何参数）
test = "bash scripts/run_pipeline.sh --img_id 0a1ba3dbefc8934ab60577c5c91f66a0"
test-front = "bash scripts/run_pipeline.sh --views front --img_id 0a1ba3dbefc8934ab60577c5c91f66a0"

# 通用流水线命令（支持传入自定义图片路径或 ID）
pipeline = "bash scripts/run_pipeline.sh"
pipeline-front = "bash scripts/run_pipeline.sh --views front"

# 2D 推理
infer-2d = "python scripts/infer_2d/img2hairstep.py"
flux-redraw = "python scripts/infer_2d/flux_redraw_multiview.py"

# 3D 求解与像素提取
run-pde = "python scripts/recon_3d/run_pde_multiview.py"
compute-maps = "python scripts/render/compute_multiview_maps.py"

# 标定与可视化
opt-cam = "python scripts/utils/opt_cam.py"
vis-align = "python scripts/utils/vis_calib_alignment.py"


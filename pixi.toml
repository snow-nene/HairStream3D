[project]
name = "HairStep_ours"
version = "0.1.0"
authors = ["clifford <1453631832@qq.com>"]
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "11.8"

[pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[dependencies]
python = "3.10.*"
pytorch = "2.1.2"
tqdm = ">=4.69.0,<5"
scikit-image = ">=0.25.0,<0.26"
modelscope = ">=1.37.1,<2"
# torchvision 和 onnx 移出此处，交由 PyPI 处理

[pypi-dependencies]
torchvision = "==0.16.2"
onnx = "==1.16.0"      
segment-anything = ">=1.0"
opencv-python = ">=4.8.0"
imageio = "*"
matplotlib = ">=3.5.0,<3.11.0"
imageio-ffmpeg = ">=0.6.0"
argparse = ">=1.4.0"
cython = ">=3.2.8"
scipy = "*"
gradio = "==2.9.4"
trimesh = "==3.9.36"
open3d = ">=0.18.0, <0.19"

[tasks]

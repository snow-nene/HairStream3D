[workspace]
name = "HairStep_ours"
version = "0.1.0"
authors = ["clifford <1453631832@qq.com>"]
channels = ["pytorch3d", "pytorch", "nvidia", "conda-forge"]
platforms = [
    "linux-64",
    { platform = "linux-64", cuda = "12.0" }
]

[pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[dependencies]
python = "3.10.*"
# 从 conda/pytorch 频道安装带 cuda 的 pytorch 和 torchvision
pytorch = { version = "2.1.2.*", channel = "pytorch" }
torchvision = { version = "0.16.2.*", channel = "pytorch" }
pytorch-cuda = "11.8.*"  # 显式引入 CUDA 11.8 依赖项
tqdm = ">=4.69.0,<5"
scikit-image = "==0.19.3"
modelscope = ">=1.37.1,<2"
timm = ">=1.0.28,<2"
numpy = ">=1.20,<1.24"
rtree = ">=1.4.1,<2"
chumpy = ">=0.70,<0.71"
pip = ">=26.1.2,<27"
pytorch3d = ">=0.7.8,<0.8"

[pypi-dependencies]
# 移除 torchvision（移到了上面的 [dependencies] 中）
onnx = "==1.16.0"      
segment-anything = ">=1.0"
opencv-python = ">=4.8.0"
imageio = "*"
matplotlib = ">=3.5.0,<3.11.0"
imageio-ffmpeg = ">=0.6.0"
argparse = ">=1.4.0"
cython = ">=3.2.8"
scipy = "*"
gradio = "==2.9.4"
trimesh = "==3.9.36"
open3d = ">=0.18.0, <0.19"
taichi = ">=1.7.4, <2"
